[package]
name = "peerdav-file-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
tokio = { version = "1", features = ["time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "macros"] }
