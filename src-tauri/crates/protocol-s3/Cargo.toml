[package]
name = "peerdav-protocol-s3"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
peerdav-file-core = { path = "../file-core" }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
hex = "0.4"
object_store = { version = "=0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"] }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
url = "2"

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
