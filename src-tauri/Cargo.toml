[package]
name = "peerdav"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "peerdav_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
zeroize = "1"
base64 = "0.22"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
dav-server = { version = "0.11.0", default-features = false, features = ["hyper"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
futures-util = "0.3"
bytes = "1"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
ipnet = "2"
ignore = "0.4"
http = "1"
# WebDAV uses the pinned mutual-TLS client configured by the application.
reqwest_dav = { version = "0.3.3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.14"
x509-parser = "0.18"
time = "0.3"
url = "2"
percent-encoding = "2"
if-addrs = "0.15"
socket2 = "0.6"
cap-std = "4"
cap-fs-ext = "4"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
