name: Release

# 推送以 v 开头的标签（例如 v0.1.0）时触发：
# 校验版本号 -> 创建发布草稿 -> 并行构建六个平台并上传安装包。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  create_release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check tag matches app version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "::error title=版本不一致::标签 ${GITHUB_REF_NAME} 与 src-tauri/tauri.conf.json 中的版本 ${app_version} 不一致，请先更新版本号"
            exit 1
          fi

      - name: Create draft release
        id: create_release
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;

            let release;
            try {
              ({ data: release } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: 'PeerDav ' + tag,
                body: 'PeerDav ' + tag + ' 自动构建的发布草稿，请确认各平台安装包后再发布。',
                draft: true,
                prerelease: tag.includes('-'),
                generate_release_notes: true,
              }));
            } catch (error) {
              if (error.status !== 422) throw error;
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
              if (!release.draft) {
                core.setFailed('Release ' + tag + ' 已存在且不是草稿，无法继续');
                return;
              }
              core.info('复用已存在的草稿发布：' + tag);
            }

            core.setOutput('release_id', release.id);

  build:
    name: ${{ matrix.name }}
    needs: create_release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # ARM64 使用 GitHub 托管的 Arm64 runner；私有仓库需确认套餐支持。
      matrix:
        include:
          # Windows
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          # Debian / Ubuntu（22.04 的 glibc 较旧，兼容 Debian 12+）
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb
          # macOS
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            cmake \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Use static CRT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "RUSTFLAGS=-Ctarget-feature=+crt-static"

      - name: Use prebuilt NASM objects on Windows x64
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "AWS_LC_SYS_PREBUILT_NASM=1"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: ${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create_release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          uploadUpdaterJson: false
