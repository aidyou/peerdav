name: Release

# 推送以 v 开头的标签（例如 v0.1.0）时触发：
# 校验版本号 -> 创建发布草稿 -> 并行构建所有平台并上传安装包。
# 平台集合来自 .github/build-matrix.json，与 build.yml（手动构建）完全一致，
# 手动验证过的包可直接复用到发布；Linux 一次编译同时产出 deb（Debian 系）与 rpm（RedHat 系）。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # 从 .github/build-matrix.json 解析完整平台矩阵，保证与手动构建的目标集合一致。
  prepare:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve build targets
        id: resolve
        run: |
          set -euo pipefail
          matrix=$(jq -c '[ .entries[] | with_entries(select(.key != "group")) ]' .github/build-matrix.json)
          if [ "$matrix" = "[]" ]; then
            echo "::error title=矩阵为空::.github/build-matrix.json 未定义任何构建目标"
            exit 1
          fi
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "构建目标：$(jq -r '[.[].name] | join(", ")' <<<"$matrix")"

  create_release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check tag matches app version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "::error title=版本不一致::标签 ${GITHUB_REF_NAME} 与 src-tauri/tauri.conf.json 中的版本 ${app_version} 不一致，请先更新版本号"
            exit 1
          fi

      - name: Create draft release
        id: create_release
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;

            let release;
            try {
              ({ data: release } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: 'PeerDav ' + tag,
                body: 'PeerDav ' + tag + ' 自动构建的发布草稿，请确认各平台安装包后再发布。',
                draft: true,
                prerelease: tag.includes('-'),
                generate_release_notes: true,
              }));
            } catch (error) {
              if (error.status !== 422) throw error;
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
              if (!release.draft) {
                core.setFailed('Release ' + tag + ' 已存在且不是草稿，无法继续');
                return;
              }
              core.info('复用已存在的草稿发布：' + tag);
            }

            core.setOutput('release_id', release.id);

  build:
    name: ${{ matrix.name }}
    needs: [create_release, prepare]
    if: needs.prepare.outputs.matrix != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            cmake \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Use static CRT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "RUSTFLAGS=-Ctarget-feature=+crt-static"

      - name: Use prebuilt NASM objects on Windows x64
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "AWS_LC_SYS_PREBUILT_NASM=1"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: ${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true

      - name: Validate updater signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e 'const c = require("./src-tauri/tauri.conf.json").plugins?.updater; if (!c?.pubkey?.trim() || !Array.isArray(c.endpoints) || !c.endpoints.length) { console.error("Configure plugins.updater.pubkey and endpoints in src-tauri/tauri.conf.json"); process.exit(1); }'
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Configure TAURI_SIGNING_PRIVATE_KEY secret before releasing"
            exit 1
          fi

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create_release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          uploadUpdaterJson: false

      # Generate one manifest per real updater artifact. Keeping these files
      # target-specific avoids concurrent matrix jobs overwriting one another.
      - name: Generate and upload updater manifests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          case "${{ matrix.name }}" in
            windows-*) platform="windows-${{ matrix.arch }}" ;;
            linux-*) platform="linux-${{ matrix.arch }}" ;;
            macos-*) platform="darwin-${{ matrix.arch }}" ;;
            *) echo "Unsupported updater platform: ${{ matrix.name }}" >&2; exit 1 ;;
          esac
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            platform="${platform/arm64/aarch64}"
          fi
          mkdir -p updater-manifests

          IFS=',' read -ra bundle_types <<< "${{ matrix.bundles }}"
          for bundle_type in "${bundle_types[@]}"; do
            case "$bundle_type" in
              nsis) artifact=$(find "$bundle_dir/nsis" -maxdepth 1 -type f -name '*.exe' ! -name '*.sig' -print -quit) ;;
              app) artifact=$(find "$bundle_dir/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit) ;;
              deb) artifact=$(find "$bundle_dir/deb" -maxdepth 1 -type f -name '*.deb' -print -quit) ;;
              rpm) artifact=$(find "$bundle_dir/rpm" -maxdepth 1 -type f -name '*.rpm' -print -quit) ;;
              appimage) artifact=$(find "$bundle_dir/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit) ;;
              dmg) continue ;;
              *) echo "Unsupported updater bundle type: $bundle_type" >&2; exit 1 ;;
            esac

            if [ -z "$artifact" ]; then
              echo "Missing $bundle_type updater artifact under $bundle_dir" >&2
              exit 1
            fi
            if [ ! -f "$artifact.sig" ]; then
              pnpm tauri signer sign "$artifact"
            fi

            manifest="updater-manifests/updater-manifest-${{ matrix.name }}-${bundle_type}.json"
            filename="$(basename "$artifact")"
            jq -n \
              --arg version "$version" \
              --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              --arg url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$filename" \
              --arg signature "$(cat "$artifact.sig")" \
              --arg platform "${platform}-${bundle_type}" \
              '{version: $version, notes: "", pub_date: $pub_date, platforms: {($platform): {url: $url, signature: $signature}}}' \
              > "$manifest"
          done

          gh release upload "${{ github.ref_name }}" updater-manifests/updater-manifest-*.json \
            --repo "${{ github.repository }}" \
            --clobber

  # Merge manifests generated by successful build jobs. A canceled optional
  # matrix entry contributes no manifest and does not block this job.
  finalize_updater_manifests:
    name: Finalize updater manifests
    needs: [create_release, build]
    if: ${{ always() && needs.create_release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download generated updater manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p updater-manifests
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern 'updater-manifest-*.json' \
            --dir updater-manifests \
            --clobber
          shopt -s nullglob
          manifests=(updater-manifests/updater-manifest-*.json)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error title=没有可用更新清单::所有构建目标都未生成 updater manifest"
            exit 1
          fi
          printf 'Downloaded manifests:\n%s\n' "${manifests[@]}"

      - name: Merge manifests by bundle type
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p finalized-manifests
          generated=()

          for bundle in nsis app deb rpm appimage; do
            files=(updater-manifests/updater-manifest-*-${bundle}.json)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "Warning: no $bundle updater manifests were generated; skipping latest-$bundle.json"
              continue
            fi
            jq -s '
              {
                version: (map(.version) | first),
                notes: "",
                pub_date: (map(.pub_date) | max),
                platforms: (map(.platforms) | add // {})
              }
            ' "${files[@]}" > "finalized-manifests/latest-$bundle.json"
            generated+=("finalized-manifests/latest-$bundle.json")
            echo "latest-$bundle.json: $(jq -r '.platforms | length' "finalized-manifests/latest-$bundle.json") platforms"
          done

          if [ "${#generated[@]}" -eq 0 ]; then
            echo "::error title=没有可用更新清单::没有任何 bundle 类型可以生成最终清单"
            exit 1
          fi

          # Keep a legacy fallback using one preferred artifact per platform:
          # NSIS for Windows, app for macOS, and DEB for Linux.
          preferred=()
          for bundle in nsis app deb; do
            if [ -f "finalized-manifests/latest-$bundle.json" ]; then
              preferred+=("finalized-manifests/latest-$bundle.json")
            fi
          done
          if [ "${#preferred[@]}" -eq 0 ]; then
            echo "::error title=无法生成 latest.json::没有可用的 NSIS、app 或 DEB 清单"
            exit 1
          fi
          jq -s '
            {
              version: (map(.version) | first),
              notes: "",
              pub_date: (map(.pub_date) | max),
              platforms: (map(.platforms) | add // {})
            }
          ' "${preferred[@]}" > finalized-manifests/latest.json
          generated+=("finalized-manifests/latest.json")

          printf 'Generated manifests:\n%s\n' "${generated[@]}"

      - name: Upload finalized updater manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" finalized-manifests/latest*.json \
            --repo "${{ github.repository }}" \
            --clobber
