name: Release

# 推送以 v 开头的标签（例如 v0.1.0）时触发：
# 校验版本号 -> 创建发布草稿 -> 并行构建所有平台并上传安装包。
# 平台集合来自 .github/build-matrix.json，与 build.yml（手动构建）完全一致，
# 手动验证过的包可直接复用到发布；Linux 一次编译同时产出 deb（Debian 系）与 rpm（RedHat 系）。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # 从 .github/build-matrix.json 解析完整平台矩阵，保证与手动构建的目标集合一致。
  prepare:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve build targets
        id: resolve
        run: |
          set -euo pipefail
          matrix=$(jq -c '[ .entries[] | with_entries(select(.key != "group")) ]' .github/build-matrix.json)
          if [ "$matrix" = "[]" ]; then
            echo "::error title=矩阵为空::.github/build-matrix.json 未定义任何构建目标"
            exit 1
          fi
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "构建目标：$(jq -r '[.[].name] | join(", ")' <<<"$matrix")"

  create_release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check tag matches app version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "::error title=版本不一致::标签 ${GITHUB_REF_NAME} 与 src-tauri/tauri.conf.json 中的版本 ${app_version} 不一致，请先更新版本号"
            exit 1
          fi

      - name: Create draft release
        id: create_release
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;

            let release;
            try {
              ({ data: release } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: 'PeerDav ' + tag,
                body: 'PeerDav ' + tag + ' 自动构建的发布草稿，请确认各平台安装包后再发布。',
                draft: true,
                prerelease: tag.includes('-'),
                generate_release_notes: true,
              }));
            } catch (error) {
              if (error.status !== 422) throw error;
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
              if (!release.draft) {
                core.setFailed('Release ' + tag + ' 已存在且不是草稿，无法继续');
                return;
              }
              core.info('复用已存在的草稿发布：' + tag);
            }

            core.setOutput('release_id', release.id);

  build:
    name: ${{ matrix.name }}
    needs: [create_release, prepare]
    if: needs.prepare.outputs.matrix != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            cmake \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Use static CRT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "RUSTFLAGS=-Ctarget-feature=+crt-static"

      - name: Use prebuilt NASM objects on Windows x64
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "AWS_LC_SYS_PREBUILT_NASM=1"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: ${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true

      - name: Validate updater signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e 'const c = require("./src-tauri/tauri.conf.json").plugins?.updater; if (!c?.pubkey?.trim() || !Array.isArray(c.endpoints) || !c.endpoints.length) { console.error("Configure plugins.updater.pubkey and endpoints in src-tauri/tauri.conf.json"); process.exit(1); }'
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Configure TAURI_SIGNING_PRIVATE_KEY secret before releasing"
            exit 1
          fi

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create_release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          uploadUpdaterJson: true

  # 客户端按 {{bundle_type}} 请求 latest-deb.json / latest-rpm.json 等，
  # 而 tauri-action 只在合并后的 latest.json 里写入 linux-x86_64-deb 这类目标。
  # 这里把合并后的清单按包类型拆分上传，两种读取方式都能拿到可安装的包。
  finalize_updater_manifests:
    name: Finalize updater manifests
    needs: [create_release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the merged manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p updater-manifests
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern 'latest.json' \
            --dir updater-manifests \
            --clobber
          if [ "$(jq -r '.platforms | length' updater-manifests/latest.json)" -eq 0 ]; then
            echo "::error title=清单为空::latest.json 没有 platforms 条目，无法生成分包清单"
            exit 1
          fi

      - name: Split the manifest per bundle type
        run: |
          set -euo pipefail
          for bundle in nsis app deb rpm appimage; do
            jq --arg suffix "-$bundle" '
              .platforms |= with_entries(select(.key | endswith($suffix)))
            ' updater-manifests/latest.json > "updater-manifests/latest-$bundle.json"
            count=$(jq -r '.platforms | length' "updater-manifests/latest-$bundle.json")
            if [ "$count" -eq 0 ]; then
              echo "::error title=缺少 $bundle 更新目标::latest.json 中没有 *-$bundle 平台"
              exit 1
            fi
            echo "latest-$bundle.json: $count 个平台"
          done

      - name: Upload per-bundle manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" updater-manifests/latest-*.json \
            --repo "${{ github.repository }}" \
            --clobber
