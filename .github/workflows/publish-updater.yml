name: Publish Updater Metadata

# 发布正式版本后，把实际生成的 updater manifest 推送到 updater-meta 分支。
# 不同平台或架构可以独立缺席；发布流程只同步 Release 中实际存在的清单。
# https://cdn.jsdelivr.net/gh/aidyou/peerdav@updater-meta/latest-deb.json
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: publish-updater-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish updater metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download updater manifests from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p updater-dist
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern 'latest*.json' \
            --dir updater-dist \
            --clobber
          shopt -s nullglob
          manifests=(updater-dist/latest*.json)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error title=缺少更新清单::发布 ${{ github.event.release.tag_name }} 没有任何 latest*.json"
            exit 1
          fi
          printf 'Downloaded manifests:\n%s\n' "${manifests[@]}"

      - name: Deploy to updater-meta branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./updater-dist
          publish_branch: updater-meta
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Publish updater manifests for ${{ github.event.release.tag_name }}'