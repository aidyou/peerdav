name: Manual Build

# 在 Actions 页面手动触发，只构建并上传工作流产物，不创建 Release。
# 平台集合与 release.yml 共用 .github/build-matrix.json，手动验证过的包可直接复用到发布。
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 构建平台
        type: choice
        required: true
        default: all
        options:
          - all
          - windows
          - linux
          - macos
      arch:
        description: 构建架构
        type: choice
        required: true
        default: all
        options:
          - all
          - x86_64
          - arm64

permissions:
  contents: read

concurrency:
  group: manual-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # 从 .github/build-matrix.json 解析所选平台/架构，未选中的平台不会启动 runner。
  prepare:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve selected targets
        id: resolve
        env:
          PLATFORM: ${{ inputs.platform }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          matrix=$(jq -c --arg p "$PLATFORM" --arg a "$ARCH" \
            '[ .entries[]
               | select(($p == "all" or .group == $p) and ($a == "all" or .arch == $a))
               | with_entries(select(.key != "group")) ]' .github/build-matrix.json)
          if [ "$matrix" = "[]" ]; then
            echo "::error title=无匹配构建目标::未匹配到构建目标（platform=${PLATFORM} arch=${ARCH}）"
            exit 1
          fi
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "已选择：$(jq -r '[.[].name] | join(", ")' <<<"$matrix")"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.matrix != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            cmake \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Use static CRT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "RUSTFLAGS=-Ctarget-feature=+crt-static"

      - name: Use prebuilt NASM objects on Windows x64
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "AWS_LC_SYS_PREBUILT_NASM=1"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: ${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true

      - name: Test filesystem behavior on target platform
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --lib fs::

      - name: Build bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          uploadUpdaterJson: false

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: PeerDav-${{ matrix.name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7
